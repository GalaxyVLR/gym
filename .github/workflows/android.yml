# Builds the IronPulse Android app (APK) on GitHub's servers every time the app files change on main.
# Download it from the repo's Releases page ("IronPulse Android app") or from this workflow run's artifacts.
# The app bundles index.html + diet-plan.js and uses Android's own scheduled notifications for the rest timer,
# so the "rest over" alert rings even with the phone locked.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - diet-plan.js
      - icon-*.png
      - capacitor.config.json
      - package.json
      - android-res/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Collect the web app
        run: |
          rm -rf www && mkdir www
          cp index.html diet-plan.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create the Android project
        run: npx cap add android

      - name: Permissions, icons and signing key
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # exact alarms so the rest alert is on time; notifications on Android 13+
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' "$M"
          grep -q USE_EXACT_ALARM "$M"
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in "$RES"/mipmap-*; do cp icon-192.png "$d/ic_launcher.png"; cp icon-192.png "$d/ic_launcher_round.png"; done
          mkdir -p "$RES/drawable" && cp android-res/ic_stat_ironpulse.xml "$RES/drawable/"
          # same signing key on every build, so a new APK installs over the old one and keeps your data
          mkdir -p ~/.android && cp android-res/debug.keystore ~/.android/debug.keystore

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IronPulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IronPulse-apk
          path: IronPulse.apk

      - name: Publish to the release page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: IronPulse Android app (latest)
          body: |
            Built from ${{ github.sha }} on ${{ github.event.head_commit.timestamp || 'manual run' }}.
            On your phone: download IronPulse.apk, open it, allow "install unknown apps" for your browser once, then install.
            Updates install over the old version and keep your data.
          files: IronPulse.apk
          overwrite_files: true
          make_latest: true
